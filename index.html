<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POECH ART | Abstract acrylic on aluminum</title>
<meta name="description" content="POECH ART, abstract geometric-organic acrylic paintings on aluminum by a Guatemala City based artist. The full portfolio is being rebuilt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root { --ink:#000; --paper:#e9e6df; --muted:#8d8a84; --ring:#2b2a28; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--ink); color:var(--paper);
    font-family:"Jost", "Helvetica Neue", Arial, sans-serif; font-weight:300;
    display:grid; place-items:center; min-height:100vh; overflow:hidden;
  }
  .rings { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  main { position:relative; text-align:center; padding:2rem; max-width:34rem; }
  h1 { font-weight:200; font-size:clamp(2.6rem, 8vw, 5rem); letter-spacing:.32em; margin-right:-.32em; line-height:1.1; }
  .medium { margin-top:1.1rem; font-size:1rem; color:var(--muted); letter-spacing:.04em; }
  .note { margin-top:2.6rem; font-size:1.05rem; line-height:1.7; }
  nav { margin-top:2.2rem; display:flex; gap:2rem; justify-content:center; flex-wrap:wrap; }
  a { color:var(--paper); text-decoration:none; border-bottom:1px solid var(--muted); padding-bottom:.15rem; font-size:.95rem; }
  a:hover, a:focus-visible { border-color:var(--paper); }
  a:focus-visible { outline:2px solid var(--paper); outline-offset:4px; }
</style>
</head>
<body>
<svg class="rings" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="none" stroke="var(--ring)" stroke-width="1.2">
    <circle cx="500" cy="500" r="120"/><circle cx="500" cy="500" r="180"/>
    <circle cx="500" cy="500" r="250"/><circle cx="500" cy="500" r="330"/>
    <circle cx="500" cy="500" r="420"/><circle cx="500" cy="500" r="520"/>
    <circle cx="500" cy="500" r="630"/>
  </g>
</svg>
<main>
  <h1>POECH ART</h1>
  <p class="medium">Abstract acrylic on aluminum, Guatemala City</p>
  <p class="note">The portfolio is being rebuilt and will be back shortly.<br>In the meantime, the work can be seen here.</p>
  <nav>
    <a href="https://instagram.com/poech_art">Instagram</a>
    <a href="https://www.saatchiart.com/account/profile/2895697">Saatchi Art</a>
    <a href="https://facebook.com/artpoech">Facebook</a>
  </nav>
</main>
</body>
</html>
